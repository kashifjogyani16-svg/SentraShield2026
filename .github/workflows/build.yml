name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build APK
        run: |
          mkdir -p build
          aapt package -f -m -J app/src/main/java -M app/src/main/AndroidManifest.xml \
            -S app/src/main/res -I $ANDROID_HOME/platforms/android-34/android.jar
          javac -d build -cp $ANDROID_HOME/platforms/android-34/android.jar \
            app/src/main/java/com/sentra/shield/*.java app/src/main/java/com/sentra/shield/R.java
          d8 --output build build/com/sentra/shield/*.class
          aapt package -f -M app/src/main/AndroidManifest.xml -S app/src/main/res \
            -I $ANDROID_HOME/platforms/android-34/android.jar -F build/unsigned.apk
          cd build && aapt add unsigned.apk classes.dex && cd ..

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore build/key.jks -alias key -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 \
            -dname "CN=Test"
          apksigner sign --ks build/key.jks --ks-pass pass:123456 \
            --out build/SentraShield.apk build/unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SentraShield-APK
          path: build/SentraShield.apk
